<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kādo Scan">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kādo Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: une seule colonne façon étiquette de slab — viseur photo en haut, fiche de cote dessous, historique en bas */
:root{
  --paper:#f6f5f2; --card:#ffffff; --ink:#16192b; --muted:#646a80; --line:#dcdde3;
  --slab:#c8102e; --slab-ink:#ffffff; --gold:#b8860b;
  --good:#1f8a4c; --warn:#b26b00; --bad:#c03030;
  --display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1120; --card:#181b2e; --ink:#eceef6; --muted:#9aa0b8; --line:#2b2f48;
  --slab:#e2364f; --slab-ink:#ffffff; --gold:#e0b44a; --good:#45c07a; --warn:#e0a240; --bad:#f06464; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1120; --card:#181b2e; --ink:#eceef6; --muted:#9aa0b8; --line:#2b2f48;
  --slab:#e2364f; --slab-ink:#ffffff; --gold:#e0b44a; --good:#45c07a; --warn:#e0a240; --bad:#f06464; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:6px;font-weight:700}
.jp{font-family:var(--display);color:var(--slab);font-size:22px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}

/* Viseur */
.scan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{position:relative;aspect-ratio:3/4;max-width:100%;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:13px;cursor:pointer;overflow:hidden;background:var(--paper)}
.shot:focus-within{outline:3px solid var(--slab);outline-offset:2px}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot b{display:block;color:var(--ink);font-size:14px}
.shot .x{position:absolute;top:6px;right:6px;z-index:2;background:var(--ink);color:var(--paper);border:0;border-radius:99px;width:28px;height:28px;font-size:16px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;flex:1;min-width:140px}
input[type=number],input[type=text]{font:inherit;font-family:var(--mono);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--slab);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:14px 18px;cursor:pointer;background:var(--slab);color:var(--slab-ink);width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:10px 14px;font-size:14px}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--bad)}

/* Fiche résultat = étiquette de slab */
.result{display:flex;flex-direction:column;gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.label{background:var(--slab);color:var(--slab-ink);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.label .nm{font-weight:700;font-size:17px;line-height:1.25;min-width:0}
.label .sub{font-size:12px;opacity:.9;grid-column:1;min-width:0}
.label .gr{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--display);font-size:30px;line-height:1}
.label .gr span{display:block;font-family:var(--body);font-size:10px;letter-spacing:.12em;font-weight:700;opacity:.9}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.ex{background:var(--gold);color:#fff;border-color:transparent}
.body{padding:14px;display:flex;flex-direction:column;gap:14px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .v{font-family:var(--mono);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.big .y{font-family:var(--mono);color:var(--muted);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
th.n{text-align:right}
tr.me td{background:color-mix(in srgb,var(--slab) 12%,transparent);font-weight:700}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--slab)}
.deal{border-radius:10px;padding:12px;font-size:14px;border:1px solid var(--line)}
.deal b{font-family:var(--mono)}
.deal.good{border-color:var(--good);color:var(--good)} .deal.mid{border-color:var(--warn);color:var(--warn)} .deal.bad{border-color:var(--bad);color:var(--bad)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:11px 8px;border-radius:9px;border:1px solid var(--line);color:var(--ink);background:var(--paper)}
.links a.main{background:var(--ink);color:var(--paper);border-color:var(--ink);grid-column:1/-1}
.note{font-size:13px;color:var(--muted)}
.src{margin:6px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}.src a{color:var(--ink);overflow-wrap:anywhere}
details.set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}details.set summary{cursor:pointer;font-weight:700}details.set .in{display:flex;flex-direction:column;gap:10px;margin-top:12px}.secret{-webkit-text-security:disc}.secret:focus{-webkit-text-security:none}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}.chk input{width:22px;height:22px}
.conf{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.conf i{display:block;height:100%;background:var(--good)}

/* Historique */
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.hitem img{width:48px;height:64px;object-fit:cover;border-radius:5px;background:var(--paper)}
.hitem .t{min-width:0}
.hitem .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .t span{font-size:12px;color:var(--muted)}
.hitem .p{font-family:var(--mono);font-weight:700;font-size:14px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.stats span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.stats b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats b.pos{color:var(--good)} .stats b.neg{color:var(--bad)}
.tools{display:flex;flex-direction:column;gap:8px}
.tools input,.tools select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hwrap{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hwrap .hitem{border:0;border-radius:0}
.hact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 8px 8px 66px}
.hact button{font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.hact button.bought{background:var(--good);border-color:var(--good);color:#fff}
.hact button.del{color:var(--bad)}
.hact input{font:inherit;font-family:var(--mono);font-size:14px;width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.hitem .p small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.hitem .p small.pos{color:var(--good)} .hitem .p small.neg{color:var(--bad)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:14px;border:1px dashed var(--line);border-radius:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--slab);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head><body>


<div class="wrap">
  <header>
    <h1>Kādo Scan<small>Cote eBay · cartes japonaises</small></h1>
    <div class="jp" aria-hidden="true">鑑定</div>
  </header>

  <section class="scan" aria-label="Scanner une carte">
    <div class="shots">
      <label class="shot" id="shot1">
        <input id="file1" type="file" accept="image/*" capture="environment" aria-label="Photo du recto">
        <div><b>Recto</b>Prends la carte<br>ou le slab en photo</div>
      </label>
      <label class="shot" id="shot2">
        <input id="file2" type="file" accept="image/*" capture="environment" aria-label="Photo du verso ou de l'étiquette (optionnel)">
        <div><b>+ Verso / étiquette</b>Optionnel, aide<br>pour l'état et le grade</div>
      </label>
    </div>
    <div class="row">
      <label class="f" for="shopPrice">Prix en boutique (¥)
        <input id="shopPrice" type="number" inputmode="numeric" placeholder="ex. 12000">
      </label>
      <label class="f" for="hint">Indice (optionnel)
        <input id="hint" type="text" placeholder="ex. Pikachu, set SV2a">
      </label>
    </div>
    <button class="btn" id="go" disabled>Estimer la cote</button>
    <div class="status" id="status" role="status"></div>
  </section>

  <section id="out" aria-live="polite"></section>

  <details class="set" id="settings">
    <summary>Réglages</summary>
    <div class="in">
      <label class="f" for="apiKey">Clé API Anthropic
        <input id="apiKey" type="text" class="secret" name="anthropic-key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" placeholder="sk-ant-api03-…">
      </label>
      <label class="f" for="model">Modèle
        <input id="model" type="text" autocomplete="off">
      </label>
      <label class="chk" for="live"><input id="live" type="checkbox"> Chercher les vraies ventes eBay en direct (plus précis, + ~0,04 € par scan)</label>
      <button class="btn ghost" id="saveKey" type="button">Enregistrer</button>
      <span class="note" id="keyMsg">La clé reste uniquement sur ce téléphone. Crée-la sur console.anthropic.com → API Keys.</span>
    </div>
  </details>

  <section class="hist" aria-label="Historique" id="histSec">
    <div class="row" style="justify-content:space-between">
      <h2>Historique des scans</h2>
      <div class="row" style="gap:6px">
        <button class="btn ghost" id="exportCsv" type="button" hidden>Exporter</button>
        <button class="btn ghost" id="clear" type="button" hidden>Vider</button>
      </div>
    </div>
    <div id="clearConfirm" class="row" hidden>
      <span class="note">Supprimer tout l'historique ?</span>
      <button class="btn ghost" id="clearYes" type="button">Oui, vider</button>
      <button class="btn ghost" id="clearNo" type="button">Annuler</button>
    </div>
    <div class="stats" id="stats" hidden></div>
    <div class="tools" id="histTools" hidden>
      <input id="histSearch" type="text" placeholder="Rechercher (nom, set, numéro)" aria-label="Rechercher dans l'historique">
      <div class="chips" role="group" aria-label="Filtrer">
        <button type="button" class="chip on" data-f="all">Toutes</button>
        <button type="button" class="chip" data-f="bought">Achetées</button>
        <button type="button" class="chip" data-f="graded">Gradées</button>
        <button type="button" class="chip" data-f="raw">Raw</button>
      </div>
      <select id="histSort" aria-label="Trier">
        <option value="date">Plus récentes</option>
        <option value="value">Plus chères</option>
        <option value="deal">Meilleure affaire</option>
      </select>
    </div>
    <div id="hist"></div>
  </section>

  <p class="note">Vérifie toujours avec le bouton « Ventes réussies eBay » avant d'acheter.</p>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const imgs = [null,null];   // Blobs prêts à envoyer
const thumbs = [null,null]; // dataURL miniatures
let busy = false, ctl = null;
const KEY = "kadoscan.hist.v1";

const EXAMPLE = {
  example:true, identified:true, game:"Pokémon", name_jp:"ピカチュウ", name_en:"Pikachu",
  set:"Pokémon Card 151 (SV2a)", set_code:"SV2a", number:"173/165", rarity:"AR", year:"2023",
  graded:false, grader:"", grade:"", condition:"NM", condition_notes:"Coins nets, pas de rayure visible au recto. Centrage correct.",
  confidence:85, eur_per_jpy:0.0061,
  prices:[
    {label:"Raw NM",eur_low:22,eur_high:30},{label:"Raw LP",eur_low:15,eur_high:21},
    {label:"Raw MP/HP",eur_low:7,eur_high:13},{label:"PSA 10",eur_low:85,eur_high:120},
    {label:"PSA 9",eur_low:35,eur_high:50},{label:"PSA 8",eur_low:22,eur_high:30}],
  current_key:"Raw NM", ebay_query:"Pikachu 173/165 AR SV2a 151 Japanese",
  jp_query:"ピカチュウ AR 173/165 SV2a", advice:"Bonne affaire au Japon sous 3 000 ¥ en raw NM. Candidate correcte au grading si le centrage est bon.",
  shop_jpy:2500
};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const eur = n => (n==null||isNaN(n))?"—":Math.round(n).toLocaleString("fr-FR")+" €";
const yen = n => (n==null||isNaN(n))?"—":Math.round(n).toLocaleString("fr-FR")+" ¥";

function loadHist(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function saveHist(h){try{localStorage.setItem(KEY,JSON.stringify(h.slice(0,300)))}catch(e){}}

async function prep(file){
  const url = URL.createObjectURL(file);
  const im = new Image(); im.src = url; await im.decode();
  const draw = (max,q) => { const r=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); return [c,q]; };
  const [big] = draw(1600); const blob = await new Promise(r=>big.toBlob(r,"image/jpeg",0.88));
  const [small] = draw(220); const thumb = small.toDataURL("image/jpeg",0.7);
  URL.revokeObjectURL(url);
  return {blob,thumb};
}

function bindShot(i){
  const input = $("#file"+(i+1)), box = $("#shot"+(i+1));
  const orig = box.querySelector("div").outerHTML;
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0]; if(!f) return;
    try{
      const {blob,thumb} = await prep(f); imgs[i]=blob; thumbs[i]=thumb;
      box.querySelectorAll("img,.x,div").forEach(n=>n.remove());
      const im=document.createElement("img"); im.src=thumb; im.alt=i?"Verso":"Recto"; box.appendChild(im);
      const x=document.createElement("button"); x.className="x"; x.type="button"; x.textContent="×"; x.setAttribute("aria-label","Retirer la photo");
      x.onclick=e=>{e.preventDefault();imgs[i]=null;thumbs[i]=null;input.value="";im.remove();x.remove();box.insertAdjacentHTML("beforeend",orig);refresh()};
      box.appendChild(x);
    }catch(e){ setStatus("Impossible de lire cette photo. Réessaie avec une autre.",true) }
    refresh();
  });
}
bindShot(0); bindShot(1);

function setStatus(t,err){const s=$("#status"); s.className="status"+(err?" err":""); s.innerHTML=t}
function refresh(){ $("#go").disabled = busy || !imgs[0]; $("#go").textContent = busy ? "Annuler" : "Estimer la cote"; if(busy) $("#go").disabled=false; }

const PROMPT = (hint) => `Tu es un expert en cartes à collectionner japonaises (Pokémon, One Piece, Dragon Ball, Yu-Gi-Oh!, Weiss Schwarz, Union Arena, etc.) et en grading (PSA, BGS, CGC, ARS).
La 1re image est le recto de la carte (ou du slab). La 2e image, si présente, est le verso ou l'étiquette du slab.
${hint?`Indice de l'utilisateur : ${hint}\n`:""}
1. Identifie la carte précisément : jeu, nom japonais et anglais, extension, code d'extension, numéro, rareté (AR, SAR, SR, UR, etc.), année.
2. Si c'est un slab : organisme et note lus sur l'étiquette. Sinon : estime l'état raw (NM, LP, MP, HP, DMG) d'après les coins, bords, surface et centrage visibles, et explique en une phrase en français.
3. Estime la cote eBay en euros d'après les ventes réussies récentes que tu connais pour la VERSION JAPONAISE de cette carte, pour : Raw NM, Raw LP, Raw MP/HP, PSA 10, PSA 9, PSA 8. Fourchette basse/haute. Sois réaliste, pas optimiste.
4. Indique quelle ligne correspond à cette carte telle qu'elle est (current_key).
5. Donne une requête de recherche eBay en anglais (nom anglais + numéro + code set + "Japanese", + "PSA 10" etc. si gradée), et une requête en japonais pour Mercari.
6. Un conseil d'achat court en français (prix max conseillé en ¥ au Japon, intérêt pour le grading).

Réponds UNIQUEMENT avec ce JSON :
{"identified":true,"game":"","name_jp":"","name_en":"","set":"","set_code":"","number":"","rarity":"","year":"","graded":false,"grader":"","grade":"","condition":"NM","condition_notes":"","confidence":0,"eur_per_jpy":0.0061,"prices":[{"label":"Raw NM","eur_low":0,"eur_high":0},{"label":"Raw LP","eur_low":0,"eur_high":0},{"label":"Raw MP/HP","eur_low":0,"eur_high":0},{"label":"PSA 10","eur_low":0,"eur_high":0},{"label":"PSA 9","eur_low":0,"eur_high":0},{"label":"PSA 8","eur_low":0,"eur_high":0}],"current_key":"Raw NM","ebay_query":"","jp_query":"","advice":""}
confidence = 0 à 100 sur l'identification. Si tu ne reconnais pas de carte, mets identified:false et explique dans condition_notes ce qu'il faudrait (photo plus nette, moins de reflet...).`;

function render(r, el){
  const mid = p => p ? (Number(p.eur_low)+Number(p.eur_high))/2 : null;
  const prices = Array.isArray(r.prices)?r.prices:[];
  const cur = prices.find(p=>p.label===r.current_key) || prices[0];
  const rate = Number(r.eur_per_jpy)||0.0061;
  if(!r.identified){
    el.innerHTML = `<div class="result"><div class="body"><h2>Carte non reconnue</h2><p>${esc(r.condition_notes||"Reprends la photo plus nette, sans reflet, carte bien à plat.")}</p></div></div>`;
    return;
  }
  const gradeTxt = r.graded ? `${esc(r.grader)} ${esc(r.grade)}` : esc(r.condition||"?");
  const gradeLbl = r.graded ? "GRADÉE" : "ÉTAT";
  let deal = "";
  if(r.shop_jpy && cur){
    const shopEur = r.shop_jpy*rate, m = mid(cur), diff = m - shopEur, pct = m? diff/m*100 : 0;
    const cls = pct>=30?"good":pct>=5?"mid":"bad";
    const verdict = pct>=30?"Bonne affaire":pct>=5?"Marge faible":"Plus cher qu'eBay";
    deal = `<div class="deal ${cls}"><strong>${verdict}</strong> · boutique <b>${yen(r.shop_jpy)}</b> ≈ <b>${eur(shopEur)}</b>, cote ≈ <b>${eur(m)}</b> → ${diff>=0?"+":""}<b>${eur(diff)}</b> (${Math.round(pct)} %). Hors frais de port et de vente eBay (~13 %).</div>`;
  }
  const q = encodeURIComponent(r.ebay_query || `${r.name_en} ${r.number} Japanese`);
  const qj = encodeURIComponent(r.jp_query || r.name_jp || r.name_en);
  el.innerHTML = `
  <div class="result">
    <div class="label">
      <div class="nm">${esc(r.name_en)} <span style="opacity:.85">${esc(r.name_jp)}</span></div>
      <div class="sub">${esc(r.game)} · ${esc(r.set)} · ${esc(r.number)} ${r.rarity?"· "+esc(r.rarity):""} ${r.year?"· "+esc(r.year):""}</div>
      <div class="gr"><span>${gradeLbl}</span>${gradeTxt}</div>
    </div>
    <div class="body">
      ${r.example?`<div><span class="tag ex">EXEMPLE</span> <span class="note">Voici à quoi ressemble un résultat. Prends ta première carte en photo.</span></div>`:""}
      <div>
        <h2>Cote estimée · ${esc(cur?.label||"")}</h2>
        <div class="big"><span class="v">${cur?eur(cur.eur_low)+" – "+eur(cur.eur_high):"—"}</span>
        <span class="y">${cur?yen(cur.eur_low/rate)+" – "+yen(cur.eur_high/rate):""}</span></div>
      </div>
      ${deal}
      ${r.condition_notes?`<p class="note" style="margin:0">${esc(r.condition_notes)}</p>`:""}
      <div style="overflow-x:auto"><table>
        <thead><tr><th>État / grade</th><th class="n">eBay (€)</th><th class="n">≈ ¥</th></tr></thead>
        <tbody>${prices.map(p=>`<tr class="${p===cur?"me":""}"><td>${esc(p.label)}</td><td class="n">${Math.round(p.eur_low)}–${Math.round(p.eur_high)} €</td><td class="n">${yen(mid(p)/rate)}</td></tr>`).join("")}</tbody>
      </table></div>
      ${r.advice?`<p style="margin:0"><strong>Conseil :</strong> ${esc(r.advice)}</p>`:""}
      <div class="links">
        <a class="main" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank" rel="noopener">Ventes réussies eBay ↗</a>
        <a href="https://www.ebay.fr/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank" rel="noopener">eBay.fr vendus ↗</a>
        <a href="https://www.pricecharting.com/search-products?type=prices&q=${q}" target="_blank" rel="noopener">PriceCharting ↗</a>
        <a href="https://jp.mercari.com/search?keyword=${qj}" target="_blank" rel="noopener">Mercari JP ↗</a>
        <a href="https://www.ebay.com/sch/i.html?_nkw=${q}" target="_blank" rel="noopener">eBay en vente ↗</a>
      </div>
      ${Array.isArray(r.sources)&&r.sources.length?`<div><h2>Ventes trouvées</h2><ul class="src">${r.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ul></div>`:""}
      <p class="note" style="margin:0">${r.example?"":r.live?"Cote basée sur une recherche en direct des ventes.":"Cote estimée sans recherche en direct."}</p>
      <div>
        <div class="row" style="justify-content:space-between"><span class="note">Fiabilité de l'identification</span><span class="note">${Number(r.confidence)||0} %</span></div>
        <div class="conf"><i style="width:${Math.max(0,Math.min(100,Number(r.confidence)||0))}%"></i></div>
      </div>
    </div>
  </div>`;
}

let hFilter="all", delAsk=null;
const midOf=r=>{const ps=r.prices||[];const c=ps.find(p=>p.label===r.current_key)||ps[0];return c?(Number(c.eur_low)+Number(c.eur_high))/2:null};
const rateOf=r=>Number(r.eur_per_jpy)||0.0061;
const paidEur=e=>e.paid_jpy?e.paid_jpy*rateOf(e.r):null;
function updEntry(id,fn){const h=loadHist();const e=h.find(x=>x.id===id);if(e){fn(e);saveHist(h)}renderHist()}
function renderHist(){
  let h = loadHist(); let changed=false;
  h.forEach((e,k)=>{if(!e.id){e.id=String(e.t)+"-"+k;changed=true}}); if(changed) saveHist(h);
  const box=$("#hist");
  $("#clear").hidden=$("#exportCsv").hidden=$("#histTools").hidden=$("#stats").hidden=!h.length;
  if(!h.length){ box.innerHTML=`<div class="empty">Tes cartes scannées s'afficheront ici, sur ce téléphone.</div>`; return; }
  const bought=h.filter(e=>e.bought);
  const val=h.reduce((a,e)=>a+(midOf(e.r)||0),0);
  const spent=bought.reduce((a,e)=>a+(paidEur(e)||0),0);
  const bval=bought.reduce((a,e)=>a+(midOf(e.r)||0),0);
  const pl=bval-spent;
  $("#stats").innerHTML=`<div><span>Cartes</span><b>${h.length}</b></div>
    <div><span>Achetées</span><b>${bought.length} · ${eur(spent)}</b></div>
    <div><span>Plus-value</span><b class="${bought.length?(pl>=0?"pos":"neg"):""}">${bought.length?(pl>=0?"+":"")+eur(pl):"—"}</b></div>`;
  const q=$("#histSearch").value.trim().toLowerCase();
  let list=h.filter(e=>{
    if(hFilter==="bought"&&!e.bought) return false;
    if(hFilter==="graded"&&!e.r.graded) return false;
    if(hFilter==="raw"&&e.r.graded) return false;
    if(!q) return true;
    return [e.r.name_en,e.r.name_jp,e.r.set,e.r.set_code,e.r.number,e.r.game,e.r.rarity].join(" ").toLowerCase().includes(q);
  });
  const sort=$("#histSort").value;
  const dealOf=e=>{const p=e.paid_jpy||e.r.shop_jpy;const m=midOf(e.r);return p&&m?(m-p*rateOf(e.r))/m:-9};
  if(sort==="value") list.sort((a,b)=>(midOf(b.r)||0)-(midOf(a.r)||0));
  else if(sort==="deal") list.sort((a,b)=>dealOf(b)-dealOf(a));
  else list.sort((a,b)=>b.t-a.t);
  if(!list.length){ box.innerHTML=`<div class="empty">Aucune carte ne correspond.</div>`; return; }
  box.innerHTML=`<div class="hist">`+list.map(e=>{
    const m=midOf(e.r), p=e.paid_jpy||e.r.shop_jpy, pe=p?p*rateOf(e.r):null;
    const diff=pe!=null&&m!=null?m-pe:null;
    const sub=diff==null?"":`<small class="${diff>=0?"pos":"neg"}">${e.bought?"payé":"boutique"} ${yen(p)} · ${diff>=0?"+":""}${eur(diff)}</small>`;
    const asking=delAsk===e.id;
    return `<div class="hwrap">
      <button class="hitem" data-open="${esc(e.id)}" type="button">${e.thumb?`<img src="${e.thumb}" alt="">`:"<span></span>"}
      <span class="t"><b>${esc(e.r.name_en||"Carte inconnue")}</b><span>${esc(e.r.set_code||e.r.set||"")} ${esc(e.r.number||"")} · ${esc(e.r.graded?(e.r.grader+" "+e.r.grade):(e.r.condition||""))} · ${new Date(e.t).toLocaleDateString("fr-FR")}</span></span>
      <span class="p">${eur(m)}${sub}</span></button>
      <div class="hact">
        ${asking?`<span class="note">Supprimer cette carte ?</span><button type="button" class="del" data-delyes="${esc(e.id)}">Supprimer</button><button type="button" data-delno="1">Annuler</button>`:
        e.bought?`<button type="button" class="bought" data-buy="${esc(e.id)}">Achetée ✓</button><label class="note">Prix payé <input type="number" inputmode="numeric" data-paid="${esc(e.id)}" value="${e.paid_jpy||""}" placeholder="¥" aria-label="Prix payé en yens"></label><button type="button" class="del" data-del="${esc(e.id)}">Supprimer</button>`:
        `<button type="button" data-buy="${esc(e.id)}">Marquer achetée</button><button type="button" class="del" data-del="${esc(e.id)}">Supprimer</button>`}
      </div></div>`;
  }).join("")+`</div>`;
  box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const e=loadHist().find(x=>x.id===b.dataset.open);if(e){render(e.r,$("#out"));$("#out").scrollIntoView({behavior:"smooth",block:"start"})}});
  box.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>updEntry(b.dataset.buy,e=>{e.bought=!e.bought;if(e.bought&&!e.paid_jpy&&e.r.shop_jpy)e.paid_jpy=e.r.shop_jpy}));
  box.querySelectorAll("[data-paid]").forEach(inp=>inp.onchange=()=>updEntry(inp.dataset.paid,e=>{e.paid_jpy=Number(inp.value)||null}));
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{delAsk=b.dataset.del;renderHist()});
  box.querySelectorAll("[data-delno]").forEach(b=>b.onclick=()=>{delAsk=null;renderHist()});
  box.querySelectorAll("[data-delyes]").forEach(b=>b.onclick=()=>{const id=b.dataset.delyes;delAsk=null;saveHist(loadHist().filter(x=>x.id!==id));renderHist()});
}
$("#histSearch").oninput=renderHist;
$("#histSort").onchange=renderHist;
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{hFilter=c.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));renderHist()});
$("#exportCsv").onclick=()=>{
  const cols=["date","jeu","nom_en","nom_jp","set","numero","rarete","etat_grade","cote_eur","prix_boutique_jpy","achetee","prix_paye_jpy"];
  const rows=loadHist().map(e=>[new Date(e.t).toISOString().slice(0,10),e.r.game,e.r.name_en,e.r.name_jp,e.r.set,e.r.number,e.r.rarity,e.r.graded?(e.r.grader+" "+e.r.grade):e.r.condition,Math.round(midOf(e.r)||0),e.r.shop_jpy||"",e.bought?"oui":"non",e.paid_jpy||""]);
  const csv="﻿"+[cols,...rows].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="kadoscan-historique.csv";document.body.appendChild(a);a.click();a.remove();
};

$("#clear").onclick=()=>{$("#clearConfirm").hidden=false};
$("#clearNo").onclick=()=>{$("#clearConfirm").hidden=true};
$("#clearYes").onclick=()=>{saveHist([]);$("#clearConfirm").hidden=true;renderHist()};

const K_KEY="kadoscan.apikey", K_LIVE="kadoscan.live", K_MODEL="kadoscan.model";
const getLS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const setLS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const apiKey=()=>getLS(K_KEY,"").trim();
$("#apiKey").value=apiKey();
$("#live").checked=getLS(K_LIVE,"1")==="1";
$("#model").value=getLS(K_MODEL,"claude-sonnet-5-5");
$("#saveKey").onclick=()=>{const v=$("#apiKey").value.trim();if(v&&!v.startsWith("sk-ant-")){$("#keyMsg").textContent="Ce n'est pas une clé Anthropic : elle doit commencer par sk-ant-. Copie-la depuis console.anthropic.com → API Keys.";return}setLS(K_KEY,v);setLS(K_MODEL,$("#model").value.trim()||"claude-sonnet-5-5");$("#keyMsg").textContent=apiKey()?"Clé enregistrée sur ce téléphone.":"Clé supprimée.";refresh()};
$("#live").onchange=()=>setLS(K_LIVE,$("#live").checked?"1":"0");
if(!apiKey()) $("#settings").open=true;

const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});

const LIVE_ADD = `
IMPORTANT : utilise l'outil de recherche web pour trouver les VRAIS prix des ventes réussies récentes (eBay sold listings en priorité, aussi PriceCharting ou 130point) de cette carte, version japonaise, dans l'état/grade concerné. Base les fourchettes sur ces résultats. Fais 2 à 4 recherches maximum. Ta réponse finale doit être uniquement le JSON.`;

async function callClaude(content, signal){
  const live=$("#live").checked;
  const body={model:getLS(K_MODEL,"claude-sonnet-5-5"),max_tokens:3000,messages:[{role:"user",content}]};
  if(live) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:4}];
  const sources=[];
  for(let round=0;round<4;round++){
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{
      "content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw {code:"api",status:res.status,message:data?.error?.message||res.statusText};
    for(const b of data.content||[]){
      if(b.type==="web_search_tool_result"&&Array.isArray(b.content)) for(const s of b.content) if(s.url&&!sources.some(x=>x.url===s.url)) sources.push({url:s.url,title:s.title||s.url});
    }
    if(data.stop_reason==="pause_turn"){ body.messages.push({role:"assistant",content:data.content}); continue; }
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    return {text,sources};
  }
  throw {code:"api",message:"Trop d'étapes de recherche."};
}
function parseJSON(t){
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=t.indexOf("{"),b=t.lastIndexOf("}"); if(a<0||b<a) throw {code:"invalid_json"};
  try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:"invalid_json"}}
}

const ERR={invalid_json:"Réponse illisible. Appuie à nouveau sur « Estimer la cote ».",
  401:"Clé API refusée. Vérifie-la dans Réglages.",403:"Clé API sans accès. Vérifie-la dans Réglages.",
  429:"Trop de scans d'affilée ou crédit épuisé. Attends un peu.",529:"Serveurs Claude surchargés. Réessaie dans une minute.",
  400:"Requête refusée"};

$("#go").onclick = async () => {
  if(busy){ ctl?.abort(); return; }
  if(!apiKey()){ $("#settings").open=true; $("#apiKey").focus(); setStatus("Ajoute ta clé API dans Réglages.",true); return; }
  if(!imgs[0]) return;
  busy = true; refresh(); ctl = new AbortController();
  const live=$("#live").checked;
  setStatus(`<span class="spin"></span>${live?"Identification + recherche des ventes eBay… (30 à 90 s)":"Identification et cote… (10 à 30 s)"}`);
  const shop = Number($("#shopPrice").value)||null;
  try{
    const content=[];
    for(const b of imgs.filter(Boolean)) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToB64(b)}});
    content.push({type:"text",text:PROMPT($("#hint").value.trim())+(live?LIVE_ADD:"")});
    const {text,sources}=await callClaude(content, ctl.signal);
    const r=parseJSON(text);
    r.shop_jpy=shop; r.sources=sources.slice(0,6); r.live=live;
    render(r, $("#out"));
    if(r.identified){ const h=loadHist(); h.unshift({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),t:Date.now(),thumb:thumbs[0],r}); saveHist(h); renderHist(); }
    setStatus("");
    $("#out").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    if(e && e.name==="AbortError") setStatus("Annulé.");
    else if(e && e.code==="api") setStatus((ERR[e.status]||"Erreur API")+(e.message?" : "+esc(e.message):""),true);
    else if(e && e.code) setStatus(ERR[e.code]||"Erreur.",true);
    else setStatus(navigator.onLine?"Problème de connexion. Réessaie.":"Pas de réseau. Il faut internet pour scanner.",true);
  }finally{ busy=false; refresh(); }
};

render(EXAMPLE, $("#out"));
renderHist();
refresh();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
